name: Test
on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test and Build
        uses: ./.github/actions/build-and-deploy
        env:
          SKIP_DEPLOY: "true"
          TRACE: 1
